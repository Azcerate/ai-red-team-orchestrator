[project]
name = "airt"
version = "0.1.0"
description = "AI Red Team Orchestrator & Compliance Report Generator"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6.0"]

[project.optional-dependencies]
report = ["markdown>=3.5", "weasyprint>=60"]
dev = ["pytest>=8.0"]

[project.scripts]
airt = "orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit package discovery (avoids flat-layout auto-discovery errors in CI)
[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
