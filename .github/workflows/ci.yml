name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests pytest
      - name: Run tests
        run: pytest    # config in pyproject (testpaths=tests, -q)

  package:
    runs-on: ubuntu-latest
    continue-on-error: true   # informational: validates pip install + console script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Editable install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Smoke-test CLI
        run: airt --help
